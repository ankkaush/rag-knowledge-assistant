# Phase 3 evaluation dataset.
#
# WHY THIS STRUCTURE (a deliberate departure from "reference_chunk_ids"):
# The original plan referenced pinning eval items to specific reference_chunk_ids.
# In practice, chunk IDs are server-generated UUIDs, regenerated on every
# re-ingestion — they cannot be checked into a version-controlled dataset file
# and stay valid. Instead, each item pins to `expected_source_uri` (the corpus
# filename, stable across re-ingestion) and the retrieval metrics below check
# whether chunks from the RIGHT DOCUMENT were retrieved, not the same exact
# chunk boundaries. This is a conscious trade: slightly coarser-grained than
# per-chunk recall, but robust to chunking-strategy changes (which is exactly
# the kind of change Phase 3 exists to let us evaluate safely).
#
# category: "factual" (answerable from the corpus) or "unanswerable" (tests
# that the system correctly refuses rather than hallucinating from outside
# knowledge — this is the PROMPT-LEVEL grounding guarantee, since retrieval
# will still return *some* chunks for an unanswerable question; it's the LLM
# that must recognize they don't actually answer it).

- id: q1
  question: "In what year was construction of the Eiffel Tower completed?"
  expected_source_uri: eiffel_tower.txt
  expected_keywords: ["1889"]
  category: factual

- id: q2
  question: "How tall is the Eiffel Tower?"
  expected_source_uri: eiffel_tower.txt
  expected_keywords: ["330 meters", "330"]
  category: factual

- id: q3
  question: "Who designed the Eiffel Tower and what did he use the top of it for?"
  expected_source_uri: eiffel_tower.txt
  expected_keywords: ["gustave eiffel", "experiments"]
  reference_answer: "Gustave Eiffel designed the tower, and he used his apartment at the top to conduct scientific experiments, including meteorology and radio transmission research."
  category: factual

- id: q4
  question: "How often is the Eiffel Tower repainted?"
  expected_source_uri: eiffel_tower.txt
  expected_keywords: ["seven years"]
  category: factual

- id: q5
