[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "RAG Knowledge Assistant — Track B Project 1 (Phases 1-5: ingestion, retrieval, generation, evaluation, observability, reranking)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "pypdf>=5.1",
    # Capped below 9.0: `ragas` (see the `eval` extra) pins tenacity to the
    # 8.x line as of this writing. Our usage (retry/retry_if_exception/
    # stop_after_attempt/wait_exponential) is stable across 8.x-9.x, so
    # relaxing this to accommodate ragas costs nothing functionally.
    "tenacity>=8.5,<10",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "langfuse>=2.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
eval = [
    "ragas>=0.4",
]
# Separate from `eval`: pulls in torch (~1GB+ install) for a local
# cross-encoder reranker. Optional because reranking is "useful, not
# essential" per the approved plan (Phase 5) — the core app and even the
# eval harness run fine without it (reranker=None is a normal, supported state).
rerank = [
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
